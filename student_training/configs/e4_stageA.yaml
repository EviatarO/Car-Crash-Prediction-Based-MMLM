# =============================================================================
# e4_stageA.yaml  —  BADAS-Open scorer reproduction (Stage A of e4_vjepa_reason)
# =============================================================================
# Goal: load nexar-ai/BADAS-Open, score our Nexar test halves (Private 677 +
#       Public 667) with the last-16-frame (~2s) window, confirm AP ~= 0.86.
#
# Data paths (manifest / frames_root / split / output) are passed on the CLI
# (one invocation per split) — see RUNPOD_E4_STAGEA.txt.
# RUN TARGET: RunPod GPU (needs credit). Use --dry_run locally first (no GPU).
# =============================================================================

# ── Model ────────────────────────────────────────────────────────────────────
model:
  hf_repo: "nexar-ai/BADAS-Open"      # official open weights (APSv2)
  use_official_loader: true           # badas_loader.py from the HF repo

# ── Preprocessing ────────────────────────────────────────────────────────────
# ⚠️ DEAD CONFIG, confirmed 2026-09-06/08 (project review §3.4/§6). The real scoring
# path is e4_stageA_badas_open_eval.py::preprocess_clip(vjepa, paths) — its signature
# takes NO cfg argument at all. It passes only `videos=<frames>` and
# `return_tensors="pt"` to vjepa.processor (the HF AutoVideoProcessor); img_size,
# num_frames, target_fps, norm_mean/norm_std below are NEVER READ on the actual
# scoring path — only num_frames is read, and only inside dry_run() as a
# warn-only mismatch check (never enforced).
#
# RESOLVED 2026-09-09 (locally, no pod/GPU needed — see NEXT_LORA_PLACEMENT.md §3 for
# the full derivation): the actual `nexar-ai/BADAS-Open` HF source is readable without
# gating. `VJEPAModel.load()` builds its processor via `AutoVideoProcessor.from_pretrained
# (model_name)` with NO img_size argument at all — `img_size=224` (the GitHub wrapper's
# constructor default) only reaches a *fallback* transform path this scorer never uses.
# Loaded `facebook/vjepa2-vitl-fpc16-256-ssv2`'s real processor directly (public Meta
# model) and ran it on 16 dummy 1280x720 frames -> measured
# `pixel_values_videos.shape == (1, 16, 3, 256, 256)`. **img_size is confirmed 256, not
# 224** - the value below is dead AND wrong; the comment above it was always correct.
#
# The model's own AutoConfig gives patch_size=16, tubelet_size=2, which on a
# (1,16,3,256,256) input mathematically forces 8 temporal groups x 16x16 spatial =
# **2048 tokens** - exactly BADAS's own documented "2048 patches x 1024 dim". This
# derivation is now STRONG for 2048, but this project's own 2026-08-13 pod-side runtime
# hook (semsup_common.py) measured **2560** on the actual loaded badas_open.pth
# checkpoint - 2560/2048=1.25, not a clean ratio. Two readings remain until a fresh pod
# check: the old 2560 measurement was under different conditions than assumed here and
# 2048 is right, OR BADAS's fine-tuning changed the effective patch grid away from the
# stock pretrained config (checkable only with real weights, i.e. the pod). Next pod
# session: re-run `e4_badas_attention_bbox.py --list_modules` AND print `patches.shape`
# right at semsup_common.py's pre-hook to settle this for real.
#
# CONFIRMED 2026-06-24 from badas/core/preprocessing.py on RunPod:
#   - img_size = 256 (VideoPreprocessor default)
#   - resize = squash (cv2.resize to (256,256), no crop)
#   - norm = ImageNet (IMAGENET_MEAN/STD constants in preprocessing.py)
# badas package does NOT expose a top-level frame_transform / build_transform,
# so manual fallback is used — values below are confirmed correct.
preprocess:
  source: "manual"     # badas has no top-level transform fn; manual values confirmed correct
  img_size: 224        # CONFIRMED: badas_loader.py VJEPAModel(img_size=224)
  num_frames: 16
  target_fps: 8
  norm_mean: [0.485, 0.456, 0.406]   # CONFIRMED: IMAGENET_MEAN in preprocessing.py
  norm_std:  [0.229, 0.224, 0.225]   # CONFIRMED: IMAGENET_STD in preprocessing.py

# ── Data fields (paths come from the CLI) ────────────────────────────────────
# Preprocessing is squash-resize (not crop), so hires or pre-squashed frames
# are equivalent. We use hires (1280x720) as the source.
#   Private: --manifest test_manifest_hires.jsonl        --frames_root /workspace/data/test_HiRes
#   Public:  --manifest test_manifest_public_hires.jsonl --frames_root /workspace/data/test_public
data:
  frame_filename_pattern: "frame_{:05d}.jpg"
  gt_field:    "event_occurs"   # 1 = collision, 0 = none
  group_field: "group"
  verdict_threshold: 0.5        # collision_verdict = YES if score >= this

# ── Acceptance ───────────────────────────────────────────────────────────────
acceptance:
  expected_ap: 0.86      # BADAS-Open Nexar AP (BADAS-1.0 Table 3)
  ap_tolerance: 0.03     # flag if |AP - 0.86| > tol -> likely a preprocessing bug
